# Stack Frappe 16 + ERPNext untuk sedekah-erp (terpisah dari stack lain).
x-app: &app
  image: ${ERPNEXT_IMAGE}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    image: ${ERPNEXT_IMAGE}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_started}
      redis-queue: {condition: service_started}

  create-site:
    image: ${ERPNEXT_IMAGE}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        if [ ! -d sites/${SITE_NAME} ]; then
        bench new-site --mariadb-user-host-login-scope='%'
        --admin-password="${ADMIN_PASSWORD}"
        --db-root-username=root --db-root-password="${DB_ROOT_PASSWORD}"
        --install-app erpnext --set-default ${SITE_NAME};
        fi
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *app
    command: ["/home/frappe/frappe-bench/env/bin/gunicorn","--chdir=/home/frappe/frappe-bench/sites","-b","0.0.0.0:8000","--threads=4","--workers=2","--worker-class=gthread","--worker-tmp-dir=/dev/shm","--timeout=120","--preload","frappe.app:application"]
  frontend:
    <<: *app
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:${HTTP_PORT}:8080"
  websocket:
    <<: *app
    command: ["node","/home/frappe/frappe-bench/apps/frappe/socketio.js"]
  scheduler:
    <<: *app
    command: ["bench","schedule"]
  queue-short:
    <<: *app
    command: ["bench","worker","--queue","short,default"]
  queue-long:
    <<: *app
    command: ["bench","worker","--queue","long,default,short"]

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
